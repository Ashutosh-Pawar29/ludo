# ==============================================================================
# Multiplayer Ludo - Server-Only Docker Compose (for AWS EC2 Backend Hosting)
# Use this when frontend is deployed on Vercel.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ludo_server_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ludo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ludo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ludo_server_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.8
    container_name: ludo_server_livekit
    restart: always
    command: --dev --node-ip ${EC2_PUBLIC_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ludo_server_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ludo}
      JWT_SECRET: ${JWT_SECRET:-ludo_super_secret_jwt_key_ec2_2026}
      REFRESHTOKEN_JWT_SECRET: ${REFRESHTOKEN_JWT_SECRET:-ludo_super_secret_refresh_jwt_key_ec2_2026}
      LIVEKIT_URL: ws://${EC2_PUBLIC_IP:-localhost}:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started

  ws:
    build:
      context: .
      dockerfile: docker/Dockerfile.ws
    container_name: ludo_server_ws
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ludo}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-ludo_super_secret_jwt_key_ec2_2026}
      REFRESHTOKEN_JWT_SECRET: ${REFRESHTOKEN_JWT_SECRET:-ludo_super_secret_refresh_jwt_key_ec2_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: ludo_server_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-server.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - ws

volumes:
  postgres_data:
  redis_data:
