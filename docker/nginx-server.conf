# HTTP Server - Health check and redirect to HTTPS
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Health check endpoint
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"ludo-backend-gateway"}';
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - SSL Termination for API and WebSockets
server {
    listen 443 ssl;
    server_name game-ashu.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/game-ashu.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game-ashu.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Health check endpoint
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"ludo-backend-gateway-https"}';
    }

    # REST API Proxy with full CORS support for Vercel
    location /api/ {
        # Handle CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, token, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Cross-Origin headers for Vercel requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, token, Authorization, X-Requested-With' always;
    }

    # WebSocket Game Engine Proxy (WSS Secure WebSockets)
    location /ws {
        proxy_pass http://ws:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long timeout for active games
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
